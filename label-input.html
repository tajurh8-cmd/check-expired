<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Input Label Expired | ExpiCheck</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">
<script>if(!localStorage.getItem("user"))location.href="login.html"</script>

<style>
body{background:#f3f6fb}
.label-page{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.menu-card{display:flex;align-items:center;gap:14px;text-decoration:none;color:#12233f;background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(20,50,90,.06)}
.menu-card .ico{width:52px;height:52px;border-radius:16px;background:#eaf2ff;color:#1769d2;display:grid;place-items:center;font-size:24px}
.menu-card .ttl{font-weight:900;font-size:17px}.menu-card .sub{font-size:13px;color:#6b7280;margin-top:3px}
.field-label{font-weight:800;color:#17365d;margin-bottom:6px}
.product-list{max-height:56vh;overflow:auto}
.product-option{border:1px solid #e4e8ef;border-radius:14px;padding:12px;background:#fff;cursor:pointer}
.product-option:active{background:#eef5ff}
.queue-item{border:1px solid #e3e7ee;border-radius:14px;padding:12px;background:#fff}
.rule-chip{border:1px solid #cfd6df;border-radius:10px;padding:8px 10px;background:#fff;font-size:12px}
.preview-wrap{overflow:auto;border-radius:16px;background:#dfe4ea;padding:12px}
.sheet{width:1123px;min-height:794px;background:#fff;margin:auto;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:185px;gap:8px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.expired-label{border:2px solid #111;background:#fff;display:flex;flex-direction:column;min-width:0;overflow:hidden;color:#000}
.expired-label .title{text-align:center;font-weight:900;font-size:21px;line-height:1.1;padding:4px 2px 2px}
.expired-label table{width:calc(100% - 8px);margin:0 4px;border-collapse:collapse;table-layout:fixed}
.expired-label th,.expired-label td{border:1.4px solid #111;text-align:center}
.expired-label th{font-weight:900;font-size:14px;height:23px;line-height:1}
.expired-label td{height:76px;font-size:25px;font-weight:900;vertical-align:middle}
.period-wrap{padding:7px 4px 4px;margin-top:auto}
.period{display:block;width:88%;border:1.5px solid #111;font-weight:900;font-style:italic;font-size:10px;line-height:1.15;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:#fff;color:#000}
@media(max-width:900px){.sheet{transform-origin:top left;transform:scale(.58);margin-bottom:-318px}.preview-wrap{height:490px}}
@media(max-width:520px){.sheet{transform:scale(.34);margin-bottom:-510px}.preview-wrap{height:300px}}
@page{size:A4 landscape;margin:5mm}
@media print{
html,body{background:#fff!important;width:auto;height:auto}
body *{visibility:hidden!important}
#printSheet,#printSheet *{visibility:visible!important}
#printSheet{position:absolute;left:0;top:0;width:287mm!important;min-height:200mm!important;padding:0!important;margin:0!important;box-shadow:none!important;display:grid!important;grid-template-columns:repeat(4,1fr)!important;grid-template-rows:repeat(4,1fr)!important;gap:1.5mm!important;transform:none!important}
.expired-label{border:.6mm solid #111!important;break-inside:avoid}
.expired-label .title{font-size:5mm!important;padding:1mm .5mm .5mm!important}
.expired-label table{width:calc(100% - 2mm)!important;margin:0 1mm!important}
.expired-label th,.expired-label td{border:.35mm solid #111!important}
.expired-label th{font-size:3.3mm!important;height:5.5mm!important}
.expired-label td{height:19mm!important;font-size:6mm!important}
.period-wrap{padding:1.8mm 1mm 1mm!important}
.period{width:88%!important;font-size:2.4mm!important;border:.35mm solid #111!important;padding:.5mm 1mm!important}
}
</style>

</head><body>
<div class="app-shell">
<header class="page-head"><a class="back" href="label-expired.html"><i class="bi bi-arrow-left"></i></a><h1>Input Label</h1></header>
<div class="label-page">
 <div class="card-soft p-3">
  <div id="storeInfo" class="fw-bold text-primary mb-3"></div>

  <label class="field-label">PLU / Barcode</label>
  <div class="input-group mb-2">
   <input id="productCode" class="form-control" inputmode="numeric" placeholder="Ketik PLU / barcode">
   <button id="btnLookup" class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
  </div>

  <a href="label-data.html" class="btn btn-outline-secondary w-100 mb-3">
   <i class="bi bi-list-ul me-2"></i>AMBIL DARI LIST BARANG
  </a>

  <label class="field-label">Produk</label>
  <input id="productName" class="form-control mb-3" placeholder="Produk akan muncul otomatis" readonly>

  <label class="field-label">Tanggal Expired</label>
  <input id="expiredDate" class="form-control mb-3" inputmode="numeric" placeholder="DDMMYY / DDMMYYYY">

  <label class="field-label">Jumlah Label</label>
  <input id="labelQty" type="number" min="1" max="100" value="1" class="form-control mb-3">

  <label class="field-label">Aturan</label>
  <select id="periodMode" class="form-select mb-3">
   <option value="AUTO">AUTO sesuai jarak expired</option>
   <option value="< 6 Bulan">< 6 Bulan — MERAH</option>
   <option value="6 sd 12 Bulan">6 sd 12 Bulan — KUNING</option>
   <option value="1 sd 2 Tahun">1 sd 2 Tahun — HIJAU</option>
   <option value="> 2 Tahun">> 2 Tahun — BIRU</option>
  </select>

  <button id="btnAdd" class="btn btn-primary w-100"><i class="bi bi-plus-circle me-2"></i>BUAT LABEL</button>
 </div>

 <a href="label-print.html" class="btn btn-outline-primary w-100 mt-3"><i class="bi bi-printer me-2"></i>LIHAT HASIL LABEL</a>
</div>
</div>
<script type="module">

import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyD_I1HSrulXlPCj9_U_FhSfsYQhz-DxbMk",
 authDomain:"dbplu-62d92.firebaseapp.com",
 projectId:"dbplu-62d92",
 storageBucket:"dbplu-62d92.firebasestorage.app",
 messagingSenderId:"623211397382",
 appId:"1:623211397382:web:db9a7bd4abcc7f44261e87"
};
const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getFirestore(app);
const user=JSON.parse(localStorage.getItem("user")||"null");
if(!user?.storeid){localStorage.removeItem("user");location.href="login.html";throw new Error("Sesi toko tidak valid")}

const $=id=>document.getElementById(id);
$("storeInfo").textContent=`${user.storeid} - ${user.storename||""}`;
let selectedProduct=null;

function toast(msg,type="success"){
 let el=document.getElementById("labelToast");
 if(!el){el=document.createElement("div");el.id="labelToast";el.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:10000;max-width:calc(100vw - 30px);padding:11px 15px;border-radius:12px;color:#fff;font-weight:700;box-shadow:0 8px 25px #0004";document.body.appendChild(el)}
 el.style.background=type==="error"?"#dc2626":type==="warning"?"#d97706":"#15803d";el.textContent=msg;el.hidden=false;clearTimeout(window.__lt);window.__lt=setTimeout(()=>el.hidden=true,2600)
}
function parseDate(v){
 const n=String(v||"").replace(/\D/g,"");if(n.length!==6&&n.length!==8)return null;
 const d=Number(n.slice(0,2)),m=Number(n.slice(2,4)),y=Number(n.length===6?"20"+n.slice(4):n.slice(4));
 const x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null
}
function periodFor(exp){
 if($("periodMode").value!=="AUTO")return $("periodMode").value;
 const today=new Date();today.setHours(0,0,0,0);const days=Math.ceil((exp-today)/86400000);
 if(days<180)return "< 6 Bulan";if(days<365)return "6 sd 12 Bulan";if(days<730)return "1 sd 2 Tahun";return "> 2 Tahun"
}
function colorText(p){if(p.startsWith("<"))return "MERAH";if(p.startsWith("6"))return "KUNING";if(p.startsWith("1"))return "HIJAU";return "BIRU"}
async function lookup(){
 const code=String($("productCode").value||"").trim();if(!code){toast("Masukkan PLU / barcode","warning");return false}
 $("productName").value="Mencari...";
 const field=code.length<=6?"PLU":"BARCODE";const value=code.length<=6?code:code.slice(0,-1);
 const snap=await getDocs(query(collection(db,"datasumber"),where(field,"==",value),limit(1)));
 if(snap.empty){selectedProduct=null;$("productName").value="Tidak ditemukan";toast("Produk tidak ditemukan","error");return false}
 const x=snap.docs[0].data();selectedProduct={plu:String(x.PLU||"").trim(),barcode:String(x.BARCODE||"").trim(),name:x.DESKRIPSI||"-",rh:Number(x.RH)||30};
 $("productCode").value=selectedProduct.plu||code;$("productName").value=selectedProduct.name;return true
}
$("btnLookup").onclick=()=>lookup().catch(e=>toast(e.message,"error"));
$("productCode").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();lookup().catch(x=>toast(x.message,"error"))}});
$("btnAdd").onclick=async()=>{
 try{
  if(!selectedProduct){const ok=await lookup();if(!ok)return}
  const exp=parseDate($("expiredDate").value);if(!exp)throw new Error("Tanggal expired tidak valid");
  const qty=Math.max(1,Math.min(100,Number($("labelQty").value)||1));const period=periodFor(exp);
  const q=JSON.parse(localStorage.getItem("expicheckLabelQueue")||"[]");
  q.push({id:(crypto.randomUUID?.()||String(Date.now()+Math.random())),...selectedProduct,exp:exp.toISOString(),qty,period,colorText:colorText(period)});
  localStorage.setItem("expicheckLabelQueue",JSON.stringify(q));
  toast(`${qty} label dibuat`);
  setTimeout(()=>location.href="label-print.html",500);
 }catch(e){toast(e.message||"Gagal membuat label","error")}
};

let pickedMaster=null;
try{
  pickedMaster=JSON.parse(localStorage.getItem("expicheckPickedMaster")||"null");
}catch{}

if(pickedMaster?.plu || pickedMaster?.name){
  selectedProduct={
    plu:String(pickedMaster.plu||"").trim(),
    barcode:String(pickedMaster.barcode||"").trim(),
    name:String(pickedMaster.name||"-").trim(),
    rh:Number(pickedMaster.rh)||30
  };

  $("productCode").value=selectedProduct.plu;
  $("productName").value=selectedProduct.name;

  // hapus setelah benar-benar berhasil masuk form
  localStorage.removeItem("expicheckPickedMaster");

  toast("Barang masuk ke form","success");
  setTimeout(()=>$("expiredDate").focus(),250);
}else{
  setTimeout(()=>$("productCode").focus(),250);
}

</script>
</body></html>
