<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Barang Label | ExpiCheck</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">
<script>if(!localStorage.getItem("user"))location.href="login.html"</script>

<style>
body{background:#f3f6fb}
.label-page{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.menu-card{display:flex;align-items:center;gap:14px;text-decoration:none;color:#12233f;background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(20,50,90,.06)}
.menu-card .ico{width:52px;height:52px;border-radius:16px;background:#eaf2ff;color:#1769d2;display:grid;place-items:center;font-size:24px}
.menu-card .ttl{font-weight:900;font-size:17px}.menu-card .sub{font-size:13px;color:#6b7280;margin-top:3px}
.field-label{font-weight:800;color:#17365d;margin-bottom:6px}
.product-list{max-height:56vh;overflow:auto}
.product-option{border:1px solid #e4e8ef;border-radius:14px;padding:12px;background:#fff;cursor:pointer}
.product-option:active{background:#eef5ff}
.queue-item{border:1px solid #e3e7ee;border-radius:14px;padding:12px;background:#fff}
.rule-chip{border:1px solid #cfd6df;border-radius:10px;padding:8px 10px;background:#fff;font-size:12px}
.preview-wrap{overflow:auto;border-radius:16px;background:#dfe4ea;padding:12px}
.sheet{width:1123px;min-height:794px;background:#fff;margin:auto;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:185px;gap:8px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.expired-label{border:2px solid #111;background:#fff;display:flex;flex-direction:column;min-width:0;overflow:hidden;color:#000}
.expired-label .title{text-align:center;font-weight:900;font-size:21px;line-height:1.1;padding:4px 2px 2px}
.expired-label table{width:calc(100% - 8px);margin:0 4px;border-collapse:collapse;table-layout:fixed}
.expired-label th,.expired-label td{border:1.4px solid #111;text-align:center}
.expired-label th{font-weight:900;font-size:14px;height:23px;line-height:1}
.expired-label td{height:76px;font-size:25px;font-weight:900;vertical-align:middle}
.period-wrap{padding:7px 4px 4px;margin-top:auto}
.period{display:block;width:88%;border:1.5px solid #111;font-weight:900;font-style:italic;font-size:10px;line-height:1.15;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:#fff;color:#000}
@media(max-width:900px){.sheet{transform-origin:top left;transform:scale(.58);margin-bottom:-318px}.preview-wrap{height:490px}}
@media(max-width:520px){.sheet{transform:scale(.34);margin-bottom:-510px}.preview-wrap{height:300px}}
@page{size:A4 landscape;margin:5mm}
@media print{
html,body{background:#fff!important;width:auto;height:auto}
body *{visibility:hidden!important}
#printSheet,#printSheet *{visibility:visible!important}
#printSheet{position:absolute;left:0;top:0;width:287mm!important;min-height:200mm!important;padding:0!important;margin:0!important;box-shadow:none!important;display:grid!important;grid-template-columns:repeat(4,1fr)!important;grid-template-rows:repeat(4,1fr)!important;gap:1.5mm!important;transform:none!important}
.expired-label{border:.6mm solid #111!important;break-inside:avoid}
.expired-label .title{font-size:5mm!important;padding:1mm .5mm .5mm!important}
.expired-label table{width:calc(100% - 2mm)!important;margin:0 1mm!important}
.expired-label th,.expired-label td{border:.35mm solid #111!important}
.expired-label th{font-size:3.3mm!important;height:5.5mm!important}
.expired-label td{height:19mm!important;font-size:6mm!important}
.period-wrap{padding:1.8mm 1mm 1mm!important}
.period{width:88%!important;font-size:2.4mm!important;border:.35mm solid #111!important;padding:.5mm 1mm!important}
}
</style>

</head><body>
<div class="app-shell">
<header class="page-head"><a class="back" href="label-expired.html"><i class="bi bi-arrow-left"></i></a><h1>Ambil Data Barang</h1></header>
<div class="label-page">
 <div class="card-soft p-3 mb-3">
  <div id="storeInfo" class="fw-bold text-primary mb-2"></div>
  <input id="search" class="form-control" placeholder="Cari nama / PLU / rak...">
 </div>
 <div id="list" class="product-list d-grid gap-2"><div class="text-secondary text-center py-4">Memuat data...</div></div>
</div></div>
<script type="module">

import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyD_I1HSrulXlPCj9_U_FhSfsYQhz-DxbMk",
 authDomain:"dbplu-62d92.firebaseapp.com",
 projectId:"dbplu-62d92",
 storageBucket:"dbplu-62d92.firebasestorage.app",
 messagingSenderId:"623211397382",
 appId:"1:623211397382:web:db9a7bd4abcc7f44261e87"
};
const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getFirestore(app);
const user=JSON.parse(localStorage.getItem("user")||"null");
if(!user?.storeid){localStorage.removeItem("user");location.href="login.html";throw new Error("Sesi toko tidak valid")}

const $=id=>document.getElementById(id);$("storeInfo").textContent=`${user.storeid} - ${user.storename||""}`;
let items=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function colorInfo(exp){const today=new Date();today.setHours(0,0,0,0);const days=Math.ceil((exp-today)/86400000);if(days<180)return ["< 6 Bulan","MERAH"];if(days<365)return ["6 sd 12 Bulan","KUNING"];if(days<730)return ["1 sd 2 Tahun","HIJAU"];return ["> 2 Tahun","BIRU"]}
function render(list){
 if(!list.length){$("list").innerHTML='<div class="text-secondary text-center py-4">Data tidak ditemukan.</div>';return}
 $("list").innerHTML=list.map(x=>`<button class="product-option text-start w-100" data-id="${esc(x.id)}"><div class="fw-bold">${esc(x.name)}</div><div class="small text-secondary">PLU ${esc(x.plu)} • Rak ${esc(x.rak)}</div><div class="small text-primary">Expired ${x.exp.toLocaleDateString("id-ID")}</div></button>`).join("");
 $("list").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
  const x=items.find(z=>z.id===b.dataset.id);if(!x)return;
  const [period,colorText]=colorInfo(x.exp);const q=JSON.parse(localStorage.getItem("expicheckLabelQueue")||"[]");
  q.push({id:(crypto.randomUUID?.()||String(Date.now()+Math.random())),plu:x.plu,barcode:x.barcode,name:x.name,rh:x.rh,exp:x.exp.toISOString(),qty:1,period,colorText});
  localStorage.setItem("expicheckLabelQueue",JSON.stringify(q));location.href="label-print.html";
 })
}
try{
 const snap=await getDocs(query(collection(db,"edItems"),where("storeid","==",user.storeid),limit(300)));
 snap.forEach(d=>{const x=d.data();if(!x.expiredDate?.toDate)return;items.push({id:d.id,plu:String(x.plu||x.barcode||"").trim(),barcode:String(x.sourceBarcode||"").trim(),name:x.deskripsi||"-",rak:x.rak||"-",exp:x.expiredDate.toDate(),rh:Number(x.RH)||30})});
 items.sort((a,b)=>a.name.localeCompare(b.name));render(items);
}catch(e){$("list").innerHTML=`<div class="alert alert-danger">Gagal membaca data: ${esc(e.message)}</div>`}
$("search").addEventListener("input",()=>{const q=$("search").value.trim().toLowerCase();render(items.filter(x=>`${x.name} ${x.plu} ${x.rak}`.toLowerCase().includes(q)))})
</script></body></html>
