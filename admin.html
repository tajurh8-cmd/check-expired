<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel | Expired Control</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d6efd">
<link rel="apple-touch-icon" href="./icon-192.png">


<script>
const sessionUser=JSON.parse(localStorage.getItem('user')||'null');
const role=String(sessionUser?.role||'').toUpperCase();
if(!sessionUser || !['ADMIN','SUPERADMIN'].includes(role)) location.href='index.html';
</script>
</head>
<body><div class="app-shell">
<header class="page-head admin-top"><a class="back" href="index.html"><i class="bi bi-arrow-left"></i></a><div><h1>Admin Panel</h1><div class="small opacity-75" id="adminInfo"></div></div></header>
<div class="container my-3">
<div class="admin-summary mb-3"><div class="mini-stat"><i class="bi bi-shop text-primary"></i><b id="summaryStores">-</b><span>Total Toko</span></div><div class="mini-stat"><i class="bi bi-people text-primary"></i><b id="summaryUsers">-</b><span>Total User</span></div><div class="mini-stat"><i class="bi bi-person-check text-success"></i><b id="summaryActive">-</b><span>User Aktif</span></div><div class="mini-stat"><i class="bi bi-hourglass text-warning"></i><b id="summaryPending">-</b><span>Pending</span></div></div>

  <ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#users">Kelola Akun <span id="pendingBadge" class="badge bg-danger ms-1">0</span></button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#stores">Kelola Toko</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#products">Edit RH Produk</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#resets">Reset Password <span id="resetBadge" class="badge bg-danger ms-1">0</span></button></li>
  </ul>

  <div class="tab-content">
    <section class="tab-pane fade show active" id="users">
      <div class="card shadow-sm mb-3"><div class="card-body">
        <div class="row g-2">
          <div class="col-md-8"><input id="userSearch" class="form-control form-control-sm" placeholder="Cari NIK, nama, toko..." oninput="renderUsers()"></div>
          <div class="col-md-4"><select id="userStatus" class="form-select form-select-sm" onchange="renderUsers()"><option value="ALL">Semua akun</option><option value="PENDING">Menunggu aktivasi</option><option value="ACTIVE">Aktif</option><option value="INACTIVE">Nonaktif</option></select></div>
        </div>
      </div></div>
      <div id="userList"></div>
    </section>

    <section class="tab-pane fade" id="stores">
      <div class="card shadow-sm mb-3"><div class="card-body">
        <h6 id="storeFormTitle">Daftarkan Toko</h6>
        <div class="row g-2">
          <div class="col-md-3"><input id="storeid" class="form-control form-control-sm text-uppercase" placeholder="Kode toko, contoh BI33"></div>
          <div class="col-md-5"><input id="storename" class="form-control form-control-sm text-uppercase" placeholder="Nama toko"></div>
          <div class="col-md-2"><select id="storeActive" class="form-select form-select-sm"><option value="true">Aktif</option><option value="false">Nonaktif</option></select></div>
          <div class="col-md-2 d-grid"><button id="saveStoreBtn" class="btn btn-primary btn-sm" onclick="saveStore()">Simpan</button></div>
        </div>
        <div id="storeMsg" class="msg mt-2"></div>
      </div></div>
      <input id="storeSearch" class="form-control form-control-sm mb-3" placeholder="Cari kode atau nama toko..." oninput="renderStores()">
      <div id="storeList"></div>
    </section>

    <section class="tab-pane fade" id="products"><input id="productSearch" class="form-control form-control-sm mb-3" placeholder="Cari barcode atau produk..." oninput="renderProducts()"><div id="productList"></div></section>
    <section class="tab-pane fade" id="resets"><div id="resetList"></div></section>
  </div>
</div></div>
<nav class="bottom-nav"><a href="index.html"><i class="bi bi-house-door"></i>Beranda</a><a href="#stores" data-bs-toggle="tab"><i class="bi bi-shop"></i>Toko</a><a class="active" href="#users" data-bs-toggle="tab"><i class="bi bi-people"></i>User</a><a href="index.html"><i class="bi bi-file-earmark-bar-graph"></i>Laporan</a></nav>

<div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h6 class="modal-title">Kelola Akun</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="editNik">
    <label class="form-label small">NIK</label><input id="editNikView" class="form-control form-control-sm mb-2" readonly>
    <label class="form-label small">Nama</label><input id="editName" class="form-control form-control-sm mb-2 text-uppercase">
    <label class="form-label small">Toko</label><select id="editStore" class="form-select form-select-sm mb-2"></select>
    <label class="form-label small">Role</label><select id="editRole" class="form-select form-select-sm mb-2"><option value="USER">USER</option><option value="ADMIN">ADMIN</option></select>
    <label class="form-label small">Status</label><select id="editActive" class="form-select form-select-sm mb-2"><option value="true">Aktif</option><option value="false">Nonaktif</option></select>
    <label class="form-label small">Password baru (kosongkan bila tidak diubah)</label><input id="editPassword" type="password" class="form-control form-control-sm" placeholder="Minimal 6 karakter">
    <div id="userMsg" class="msg mt-2"></div>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" onclick="saveUser()">Simpan</button></div>
</div></div></div>

<div class="modal fade" id="productModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h6 class="modal-title">Edit RH Produk</h6><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="editProductId"><label class="small">Produk</label><input id="editProductName" class="form-control form-control-sm mb-2" readonly><label class="small">Barcode</label><input id="editProductBarcode" class="form-control form-control-sm mb-2" readonly><label class="small">RH (hari)</label><input id="editProductRh" type="number" min="0" class="form-control form-control-sm"><div id="productMsg" class="msg mt-2"></div></div><div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button><button class="btn btn-primary btn-sm" onclick="saveProductRh()">Simpan</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="admin.js"></script>
<script>document.getElementById('adminInfo').innerText=`${sessionUser.username} • ${sessionUser.role}`;</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script>
</body>
</html>
