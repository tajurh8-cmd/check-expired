<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | ExpiCheck</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d47a1"><link rel="apple-touch-icon" href="icon-192.png"></head><body class="login-page"><div class="login-wrap"><div class="login-brand"><img src="icon-192.png"><h1><span>Expi</span>Check</h1><p>CHECK EXPIRED, PROTECT SALES</p></div><div class="login-card"><div id="loginPanel"><h5 class="fw-bold mb-3">Masuk ke aplikasi</h5><input id="nik" class="form-control mb-3" placeholder="NIK" inputmode="numeric"><input id="nama" class="form-control mb-3" placeholder="Nama / Toko" readonly tabindex="-1"><input id="password" type="password" class="form-control mb-2" placeholder="Password"><div id="msg" class="msg mb-2"></div><button class="btn btn-primary w-100" onclick="login()">LOGIN</button><div class="switch-link">Belum punya akun? <button type="button" class="btn btn-link btn-sm p-0" onclick="showRegister()">Register</button><br><button type="button" class="btn btn-link btn-sm p-0 mt-1" onclick="showForgot()">Lupa password?</button></div></div><div id="registerPanel" class="d-none"><h5 class="fw-bold mb-3">Daftar akun</h5><input id="regNik" class="form-control mb-3" placeholder="NIK" inputmode="numeric"><input id="regNama" class="form-control mb-3" placeholder="Nama lengkap"><input id="regStoreid" class="form-control mb-3 text-uppercase" placeholder="Kode toko, contoh BI33"><input id="regPhone" class="form-control mb-3" placeholder="Nomor WhatsApp, contoh 081234567890" inputmode="tel"><input id="regStorename" class="form-control mb-3" placeholder="Nama toko" readonly tabindex="-1"><input id="regPassword" type="password" class="form-control mb-3" placeholder="Password minimal 6 karakter"><input id="regConfirm" type="password" class="form-control mb-2" placeholder="Ulangi password"><div id="regMsg" class="msg mb-2"></div><button id="registerBtn" class="btn btn-success w-100" onclick="registerUser()">DAFTAR</button><div class="switch-link">Sudah punya akun? <button type="button" class="btn btn-link btn-sm p-0" onclick="showLogin()">Kembali ke login</button></div></div><div id="forgotPanel" class="d-none"><h5 class="fw-bold mb-3">Lupa password</h5><p class="small text-muted">Masukkan NIK dan kode toko. Password akan di-reset menjadi 6 digit terakhir NIK.</p><input id="forgotNik" class="form-control mb-3" placeholder="NIK" inputmode="numeric"><input id="forgotStoreid" class="form-control mb-2 text-uppercase" placeholder="Kode toko"><div id="forgotMsg" class="msg mb-2"></div><button id="forgotBtn" class="btn btn-primary w-100" onclick="requestPasswordReset()">RESET PASSWORD</button><div class="switch-link"><button type="button" class="btn btn-link btn-sm p-0" onclick="showLogin()">Kembali ke login</button></div></div><div id="changePasswordPanel" class="d-none"><h5 class="fw-bold mb-3">Buat password baru</h5><p class="small text-muted">Password sementara hanya dapat dipakai satu kali.</p><input id="newPassword" type="password" class="form-control mb-3" placeholder="Password baru minimal 6 karakter"><input id="confirmNewPassword" type="password" class="form-control mb-2" placeholder="Ulangi password baru"><div id="changePasswordMsg" class="msg mb-2"></div><button id="changePasswordBtn" class="btn btn-primary w-100" onclick="changeForcedPassword()">SIMPAN PASSWORD</button></div></div></div><script type="module" src="login.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));</script></body></html>
