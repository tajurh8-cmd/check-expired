<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Expired Control</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d6efd">

<style>
body{
  background:#f4f6f8;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:100%;
  max-width:380px;
}
.msg{
  font-size:12px;
  color:#dc3545;
}
</style>
</head>

<body>

<div class="card shadow-sm">
  <div class="card-body">
    <h5 class="text-center mb-3">Expired Control</h5>

    <input id="nik" class="form-control form-control-sm mb-2" placeholder="NIK">
    <input id="nama" class="form-control form-control-sm mb-2" placeholder="Nama"
           readonly tabindex="-1">
    <input id="password" type="password" class="form-control form-control-sm mb-2"
           placeholder="Password">

    <div id="msg" class="msg mb-2"></div>

    <button class="btn btn-primary btn-sm w-100" onclick="login()">Login</button>
  </div>
</div>

<script type="module" src="login.js"></script>

<!-- SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js");
}
</script>

</body>
</html>
