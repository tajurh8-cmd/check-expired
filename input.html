<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input | Expired Control</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f6f8}
.card{max-width:420px;margin:auto}
#scannerBox{
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
}
#scanArea{
  position:absolute;
  top:50%;
  left:50%;
  width:70%;
  height:40%;
  transform:translate(-50%,-50%);
  border:3px solid rgba(255,0,0,.8);
  border-radius:12px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.4);
  pointer-events:none;
}
</style>

<script>
if(!localStorage.getItem("user")) location.href="login.html";
</script>
</head>

<body>
<div class="container my-4">

<a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">← Dashboard</a>

<div class="card shadow-sm">
  <div class="card-body">

    <h6 class="text-center mb-1">Input Expired Item</h6>
    <div id="storeInfo" class="text-center text-muted small mb-3"></div>

    <select id="rakSelect" class="form-select mb-2"></select>
    <input id="rakInput" class="form-control mb-2" placeholder="+ rak baru">

    <div class="input-group mb-2">
      <input id="barcode" class="form-control" placeholder="Scan / input barcode">
      <button class="btn btn-outline-primary" id="btnScan">📷</button>
    </div>

    <input id="deskripsi" class="form-control mb-2" readonly placeholder="Deskripsi barang">

    <input id="expired" class="form-control mb-2"
      placeholder="DDMMYY / DDMMYYYY"
      inputmode="numeric"
      maxlength="8">

    <input id="qty" type="number" class="form-control mb-3" placeholder="Qty">

    <button id="btnSave" class="btn btn-primary w-100">SIMPAN</button>

  </div>
</div>
</div>

<!-- SCANNER -->
<div id="scannerBox" class="d-none">
  <video id="video" autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video>
  <div id="scanArea"></div>
  <button id="btnCloseScan" class="btn btn-danger w-100 position-absolute bottom-0">
    Tutup
  </button>
</div>

<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
