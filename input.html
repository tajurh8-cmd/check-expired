<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Expired | ExpiCheck</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d47a1"><script>if(!localStorage.getItem('user'))location.href='login.html'</script><style>#scannerBox{position:fixed;inset:0;background:#000;z-index:9999}#scanArea{position:absolute;top:50%;left:50%;width:75%;height:35%;transform:translate(-50%,-50%);border:3px solid #ef3340;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.42);pointer-events:none}</style></head><body><div class="app-shell"><header class="page-head"><a class="back" href="index.html"><i class="bi bi-arrow-left"></i></a><h1>Input Expired</h1></header><div class="form-card"><div id="storeInfo" class="eyebrow mb-3"></div><label class="form-label">Rak</label><select id="rakSelect" class="form-select mb-2"></select><input id="rakInput" class="form-control mb-3" placeholder="+ Tambahkan rak baru"><label class="form-label">Barcode</label><div class="input-group mb-3"><input id="barcode" class="form-control" placeholder="Scan / input barcode"><button class="btn btn-outline-primary" id="btnScan"><i class="bi bi-upc-scan"></i></button></div><label class="form-label">Produk</label><input id="deskripsi" class="form-control mb-3" readonly placeholder="Produk akan muncul otomatis"><label class="form-label">Tanggal Expired</label><input id="expired" class="form-control mb-3" placeholder="DDMMYY / DDMMYYYY" inputmode="numeric" maxlength="8"><label class="form-label">QTY</label><input id="qty" type="number" class="form-control mb-4" placeholder="Jumlah produk"><button id="btnSave" class="btn btn-primary w-100"><i class="bi bi-floppy me-2"></i>SIMPAN</button></div></div><nav class="bottom-nav"><a href="index.html"><i class="bi bi-house-door"></i>Dashboard</a><a class="active" href="input.html"><i class="bi bi-upc-scan"></i>Input</a><a href="index.html#list"><i class="bi bi-file-earmark-text"></i>Riwayat</a><a href="index.html"><i class="bi bi-person"></i>Akun</a></nav><div id="scannerBox" class="d-none"><video id="video" autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video><div id="scanArea"></div><button id="btnCloseScan" class="btn btn-danger w-100 position-absolute bottom-0 rounded-0 py-3">Tutup Scanner</button></div><script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script><script type="module" src="app.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));</script></body></html>
