<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Expired | ExpiCheck</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d47a1"><script>if(!localStorage.getItem('user'))location.href='login.html'</script><style>#scannerBox{position:fixed;inset:0;background:#000;z-index:9999}#scanArea{position:absolute;top:50%;left:50%;width:86%;height:22%;transform:translate(-50%,-50%);border:3px solid #ef3340;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.42);pointer-events:none}</style></head><body><div class="app-shell"><header class="page-head"><a class="back" href="index.html"><i class="bi bi-arrow-left"></i></a><h1>Input Expired</h1></header><div class="form-card"><div id="storeInfo" class="eyebrow mb-3"></div><div class="d-flex align-items-center justify-content-between"><label class="form-label mb-1">Rak</label><a href="jadwal.html" class="small fw-bold text-decoration-none"><i class="bi bi-calendar-week me-1"></i>Atur Jadwal</a></div><select id="rakSelect" class="form-select mb-2"></select><div id="scheduleInfo" class="small text-primary fw-semibold mb-2 d-none"></div><input id="rakInput" class="form-control mb-3" placeholder="+ Tambahkan rak baru"><label class="form-label">PLU / Barcode</label><div class="input-group mb-3"><input id="barcode" class="form-control" inputmode="numeric" placeholder="Input PLU / scan barcode"><button class="btn btn-outline-primary" id="btnScan"><i class="bi bi-upc-scan"></i></button></div><label class="form-label">Produk</label><input id="deskripsi" class="form-control mb-2" readonly placeholder="Produk akan muncul otomatis"><div id="newProductBox" class="border rounded-3 p-3 mb-3 d-none bg-light"><div class="fw-bold mb-2">Produk belum ada di master</div><input id="newProductPlu" class="form-control mb-2" inputmode="numeric" placeholder="PLU (wajib, maks. 6 karakter)" maxlength="6" required><input id="newProductBarcode" class="form-control mb-2" inputmode="numeric" placeholder="Barcode fisik lengkap (wajib)" required><input id="newProductName" class="form-control mb-2" placeholder="Nama produk"><input id="newProductRh" type="number" min="0" class="form-control mb-2" placeholder="RH produk (hari)"><button id="btnCreateProduct" type="button" class="btn btn-success w-100"><i class="bi bi-plus-circle me-2"></i>TAMBAH PRODUK BARU</button><div id="newProductMsg" class="small mt-2"></div></div><label class="form-label">Tanggal Expired</label><input id="expired" class="form-control mb-3" placeholder="DDMMYY / DDMMYYYY" inputmode="numeric" maxlength="8"><label class="form-label">QTY</label><input id="qty" type="number" class="form-control mb-4" placeholder="Jumlah produk"><button id="btnSave" class="btn btn-primary w-100"><i class="bi bi-floppy me-2"></i>SIMPAN</button></div></div><nav class="bottom-nav"><a href="index.html"><i class="bi bi-house-door"></i>Dashboard</a><a class="active" href="input.html"><i class="bi bi-upc-scan"></i>Input</a><a href="index.html#list"><i class="bi bi-file-earmark-text"></i>Riwayat</a><a href="index.html"><i class="bi bi-person"></i>Akun</a></nav><div id="scannerBox" class="d-none"><video id="video" autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video><div id="scanArea"></div><div class="position-absolute top-0 end-0 p-3 d-flex gap-2"><button id="btnTorch" type="button" class="btn btn-light rounded-circle d-none" style="width:48px;height:48px" aria-label="Flash"><i class="bi bi-lightning-fill"></i></button></div><div class="position-absolute start-50 translate-middle-x text-white text-center" style="top:68%;width:90%;text-shadow:0 1px 3px #000"><div class="fw-semibold">Arahkan barcode ke area merah</div><small>Jaga jarak ±10–20 cm sampai barcode terbaca</small></div><button id="btnCloseScan" class="btn btn-danger w-100 position-absolute bottom-0 rounded-0 py-3">Tutup Scanner</button></div><script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script><script src="ui-dialog.js"></script><script type="module" src="app.js?v=scanner-fix-2"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));</script></body></html>
