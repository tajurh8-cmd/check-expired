<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExpiCheck</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d47a1"><link rel="apple-touch-icon" href="icon-192.png"><script>if(!localStorage.getItem('user'))location.href='login.html'</script></head><body>
<div class="app-shell">
<header class="topbar"><div class="topbar-row"><div class="brand"><i class="bi bi-list"></i><span>Dashboard</span></div><div class="d-flex align-items-center gap-3"><button id="btnNotification" class="btn p-0 border-0 bg-transparent text-white" type="button" aria-label="Aktifkan notifikasi"><i class="bi bi-bell fs-5"></i></button><img class="avatar" src="icon-192.png"></div></div></header>
<section class="hero-card"><div><div class="eyebrow" id="storeCode">TOKO</div><h1 id="greeting">Halo!</h1><div class="store-line" id="userInfo"></div></div><div class="mascot-bubble">👋</div></section>
<section class="section pt-3"><div id="todayNotice" class="card-soft p-3 d-none"></div></section>
<section class="section pt-1"><a href="label-expired.html" class="card-soft p-3 d-flex align-items-center justify-content-between text-decoration-none text-dark"><div class="d-flex align-items-center gap-3"><div class="rounded-3 bg-primary-subtle text-primary d-flex align-items-center justify-content-center" style="width:46px;height:46px"><i class="bi bi-tags fs-4"></i></div><div><div class="fw-bold">Create Label Expired</div><div class="small text-secondary">Input / pilih data barang lalu cetak label</div></div></div><i class="bi bi-chevron-right text-secondary"></i></a></section><section class="section"><div class="section-title"><h2>Ringkasan Monitoring</h2><a href="#list">Lihat semua <i class="bi bi-chevron-right"></i></a></div><div class="stat-grid"><div class="stat red"><b id="bawah6">0</b><span>&lt; 6 Bulan</span></div><div class="stat orange"><b id="bulan6_12">0</b><span>6–12 Bulan</span></div><div class="stat blue"><b id="tahun1_2">0</b><span>1–2 Tahun</span></div><div class="stat green"><b id="atas2">0</b><span>&gt; 2 Tahun</span></div></div></section>
<section class="section"><div class="card-soft p-3"><div class="d-flex justify-content-between"><div><div class="label">TOTAL QTY</div><div class="big" id="totalQty">0</div></div><div class="text-end"><div class="label">TOTAL ITEM</div><div class="big" id="totalItem">0</div></div></div></div></section>
<section class="section"><div class="section-title"><h2>Produk Berdasarkan Tanggal Tarik</h2></div><div id="list"></div></section>
</div>
<nav class="bottom-nav"><a class="active" href="index.html"><i class="bi bi-house-door-fill"></i>Dashboard</a><a href="input.html"><i class="bi bi-upc-scan"></i>Input</a><a href="#list"><i class="bi bi-file-earmark-text"></i>Riwayat</a><a id="adminBtn" class="d-none" href="admin.html"><i class="bi bi-gear"></i>Admin</a><button onclick="logout()"><i class="bi bi-person"></i>Keluar</button></nav>
<script src="ui-dialog.js"></script><script type="module" src="dashboard.js?v=fcm-bell-fix-1"></script><script>const u=JSON.parse(localStorage.getItem('user'));document.getElementById('storeCode').textContent=`${u.storeid} - ${u.storename}`;document.getElementById('greeting').textContent=`Halo, ${(u.username||'User').split(' ')[0]}!`;document.getElementById('userInfo').textContent=`${u.username} • ${u.role||'USER'}`;if(['ADMIN','SUPERADMIN'].includes(String(u.role||'').toUpperCase()))document.getElementById('adminBtn').classList.remove('d-none');function logout(){localStorage.removeItem('user');location.href='login.html'}if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));</script></body></html>
