<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expired Control | Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f6f8}
.label{font-size:12px;color:#6c757d}
.big{font-size:22px;font-weight:700}
.item-card{margin-bottom:12px}
.b-merah{border-left:6px solid #dc3545}
.b-kuning{border-left:6px solid #ffc107}
.b-hijau{border-left:6px solid #198754}
.b-biru{border-left:6px solid #0d6efd}
.b-abu{border-left:6px solid #6c757d}
.pill{font-size:11px;padding:4px 8px;border-radius:12px;font-weight:600}
</style>

<script>
if(!localStorage.getItem("user")) location.href="login.html";
</script>
</head>

<body>
<div class="container my-3">

<div class="d-flex justify-content-between mb-3">
  <div>
    <b>Expired Dashboard</b>
    <div class="label" id="userInfo"></div>
  </div>
  <div class="d-flex gap-2">
    <a href="admin.html" id="adminBtn" class="btn btn-sm btn-dark d-none">Admin</a>
    <a href="input.html" class="btn btn-sm btn-primary">+ Input</a>
    <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Logout</button>
  </div>
</div>

<!-- CARD RINGKASAN -->
<div class="row g-2 mb-3">
  <div class="col-6"><div class="card"><div class="card-body"><div class="label">TOTAL QTY</div><div class="big" id="totalQty">0</div></div></div></div>
  <div class="col-6"><div class="card"><div class="card-body"><div class="label">TOTAL ITEM</div><div class="big" id="totalItem">0</div></div></div></div>
  <div class="col-6"><div class="card b-merah"><div class="card-body"><div class="label">&lt; 6 BULAN</div><div class="big" id="bawah6">0</div></div></div></div>
  <div class="col-6"><div class="card b-kuning"><div class="card-body"><div class="label">6–12 BULAN</div><div class="big" id="bulan6_12">0</div></div></div></div>
  <div class="col-6"><div class="card b-hijau"><div class="card-body"><div class="label">1–2 TAHUN</div><div class="big" id="tahun1_2">0</div></div></div></div>
  <div class="col-6"><div class="card b-biru"><div class="card-body"><div class="label">&gt; 2 TAHUN</div><div class="big" id="atas2">0</div></div></div></div>
</div>

<!-- LIST ITEM -->
<div id="list"></div>

</div>

<script type="module" src="dashboard.js"></script>
<script>
const u = JSON.parse(localStorage.getItem("user"));
document.getElementById("userInfo").innerText = `${u.username} (${u.role||"-"}) • ${u.storeid} - ${u.storename}`;
if(["ADMIN","SUPERADMIN"].includes(String(u.role||"").toUpperCase())) document.getElementById("adminBtn").classList.remove("d-none");
function logout(){ localStorage.removeItem("user"); location.href="login.html"; }
</script>
</body>
</html>
