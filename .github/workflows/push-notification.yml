name: ExpiCheck Push Notification

on:
  schedule:
    # 08:00 WIB = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Send ExpiCheck reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TZ: Asia/Jakarta
        run: node scripts/push-reminder.js
